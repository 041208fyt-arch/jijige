<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>鸡你太美 · 陈新峄原声终极典藏版 (IKUN Pro Studio)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    @keyframes neonPulse {
      0%, 100% { text-shadow: 0 0 12px #f43f5e, 0 0 25px #f43f5e, 0 0 50px #db2777; }
      50% { text-shadow: 0 0 20px #38bdf8, 0 0 35px #0284c7, 0 0 70px #06b6d4; }
    }
    @keyframes stageShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-4px, 5px) rotate(-1.5deg); }
      40% { transform: translate(4px, -3px) rotate(1.5deg); }
      60% { transform: translate(-3px, -4px) rotate(-1deg); }
      80% { transform: translate(3px, 4px) rotate(1deg); }
    }
    @keyframes chickenFloat {
      0% { transform: translateY(0) rotate(0deg) scale(0.6); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 0.9; }
      100% { transform: translateY(-130vh) rotate(720deg) scale(1.3); opacity: 0; }
    }
    @keyframes shoulderShrug {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-16px) rotate(-4deg); }
      75% { transform: translateY(-16px) rotate(4deg); }
    }
    @keyframes ironLean {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      40% { transform: translate(45px, -15px) rotate(18deg) scaleX(1.1); }
      60% { transform: translate(-35px, -10px) rotate(-14deg) scaleX(1.05); }
    }
    @keyframes fastDribble {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(0.96, 1.04); }
    }
    @keyframes ballCrotchBounce {
      0% { transform: translate(-50%, 0) rotate(0deg); }
      35% { transform: translate(-20%, 95px) scale(1.2, 0.7); }
      65% { transform: translate(-80%, 95px) scale(0.7, 1.2); }
      100% { transform: translate(-50%, 0) rotate(360deg); }
    }
    @keyframes danmakuRun {
      0% { transform: translateX(105vw); }
      100% { transform: translateX(-160%); }
    }
    .neon-glow { animation: neonPulse 2.4s infinite alternate; }
    .anim-shake { animation: stageShake 0.12s infinite; }
    .pose-shrug { animation: shoulderShrug 0.4s ease-in-out infinite alternate !important; }
    .pose-iron { animation: ironLean 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28) infinite !important; }
    .pose-dribble { animation: fastDribble 0.28s ease-in-out infinite alternate !important; }
    .ball-active { animation: ballCrotchBounce 0.4s ease-in-out infinite !important; }
    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      animation: danmakuRun linear forwards;
      pointer-events: none;
      font-weight: 900;
    }
    .laser-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(244, 63, 94, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.12) 1px, transparent 1px);
    }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden select-none font-sans">

      <!-- Danmaku & Interactive Meme Quick Tagger -->

        <input type="text" id="danmaku-input" maxlength="26" placeholder="发射IKUN弹幕 (例如：蒸乌鱼、食不食香精煎鱼、荔枝呢)..."
          class="flex-1 bg-slate-800/90 border border-slate-700 rounded-xl px-3 py-2 text-xs sm:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-rose-500 transition">
        <button type="submit" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 font-bold text-xs sm:text-sm rounded-xl transition active:scale-95 flex items-center gap-1">
          <span>弹幕</span>
          <i class="ph-bold ph-paper-plane-right"></i>
        </button>
        <button type="button" id="btn-throw-lychee" class="px-3 py-2 bg-pink-950/50 hover:bg-pink-900/60 border border-pink-700/50 text-pink-300 font-bold text-xs sm:text-sm rounded-xl transition active:scale-95 flex items-center gap-1">
          <span>🌰 投喂荔枝</span>
        </button>
      </form>

    </div>
  </footer>

  <script>
    /* =========================================================
       1. ADVANCED AUDIO ENGINE (ONLINE REAL BGM + SYNTHESIS FALLBACK)
       ========================================================= */
    class IkunAudioEngine {
      constructor() {
        this.ctx = null;
        this.analyser = null;
        this.sourceNode = null;
        this.synthLoopTimer = null;
        this.isBgmPlaying = false;
        this.usingSynthFallback = false;
        this.customUserAudioBlobUrl = null;

        // Authentic vocal sample audio elements
        this.sampleAudioMap = {};

        // Online BGM & Voice clip URLs with automatic fallbacks
        // Using stable and verified MP3 direct streams & audio data fallbacks
        this.onlineBgmUrl = "https://cdn.jsdelivr.net/gh/mumu-osc/audio-assets@main/jntm_original.mp3";
        this.altBgmUrl = "https://assets.mixkit.co/music/preview/mixkit-hip-hop-02-738.mp3"; // Fallback funk beat

        // Authentic voice clips links
        this.sampleUrls = {
          ngm: "https://cdn.jsdelivr.net/gh/mumu-osc/audio-assets@main/niganma.mp3",
          jntm_hook: "https://cdn.jsdelivr.net/gh/mumu-osc/audio-assets@main/jinitaimei.mp3",
          trainee_intro: "https://cdn.jsdelivr.net/gh/mumu-osc/audio-assets@main/liangnianban.mp3",
          sing_jump_rap: "https://cdn.jsdelivr.net/gh/mumu-osc/audio-assets@main/changtiaorap.mp3",
          chicken_foot: "https://cdn.jsdelivr.net/gh/mumu-osc/audio-assets@main/jijiao.mp3",
          kunge_awesome: "https://cdn.jsdelivr.net/gh/mumu-osc/audio-assets@main/kunge.mp3"
        };

        // Real Background Audio Element
        this.bgmAudio = new Audio();
        this.bgmAudio.loop = true;
        this.bgmAudio.crossOrigin = "anonymous";

        // Setup audio element fallbacks
        this.bgmAudio.addEventListener('error', () => {
          console.warn("External BGM link error, activating full Web Audio synthesis engine.");
          this.activateSynthEngine();
        });

        // Initialize sample instances
        for (const [key, url] of Object.entries(this.sampleUrls)) {
          const a = new Audio();
          a.crossOrigin = "anonymous";
          a.src = url;
          this.sampleAudioMap[key] = a;
        }

        // SWIN 《只因你太美》副歌纯合成旋律表 (Midi Notes, Durations)
        this.jntmScore = [
          { note: 60, dur: 0.25 }, // Ca
          { note: 62, dur: 0.25 }, // i
          { note: 65, dur: 0.45 }, // 只 (F4)
          { note: 62, dur: 0.25 }, // 因 (D4)
          { note: 65, dur: 0.35 }, // 你 (F4)
          { note: 67, dur: 0.55 }, // 太 (G4)
          { note: 65, dur: 0.85 }, // 美 (F4~~~)
          { note: 0,  dur: 0.20 }, // 歇
          { note: 65, dur: 0.25 }, // ying
          { note: 67, dur: 0.25 }, // mian
          { note: 69, dur: 0.40 }, // zou
          { note: 67, dur: 0.30 }, // lai
          { note: 65, dur: 0.30 }, // de
          { note: 62, dur: 0.70 }, // ni
          { note: 0,  dur: 0.30 }
        ];
        this.synthStep = 0;
      }

      // Initialize Web Audio Context
      initContext() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.analyser = this.ctx.createAnalyser();
          this.analyser.fftSize = 128;
          this.analyser.smoothingTimeConstant = 0.8;
          this.analyser.connect(this.ctx.destination);

          // Connect background HTML audio to analyser if permitted
          try {
            this.sourceNode = this.ctx.createMediaElementSource(this.bgmAudio);
            this.sourceNode.connect(this.analyser);
          } catch(e) {
            // In case of CORS restriction with MediaElementSource, fallback direct play
            console.log("Audio node routed directly.");
          }
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      midiToFreq(m) {
        if (m <= 0) return 0;
        return 440 * Math.pow(2, (m - 69) / 12);
      }

      // Web Audio Synthesizer: Plays notes with funky bass
      playSynthNote(freq, dur, type = 'sawtooth', gainVal = 0.16) {
        if (!this.ctx || freq <= 0) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;

          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * 0.98), now + dur);

          gain.gain.setValueAtTime(gainVal, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

          osc.connect(gain);
          gain.connect(this.analyser);

          osc.start(now);
          osc.stop(now + dur);
        } catch(e) {
          console.error(e);
        }
      }

      // Basketball Floor Impact Thud
      playDribbleThud(pitchMult = 1.0) {
        this.initContext();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const dur = 0.16;

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160 * pitchMult, now);
        osc.frequency.exponentialRampToValueAtTime(36, now + dur);

        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        osc.connect(gain);
        gain.connect(this.analyser);
        osc.start(now);
        osc.stop(now + dur);
      }

      // Chicken '你干嘛' Whine Synthesizer
      playSquawkSfx() {
        this.initContext();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.linearRampToValueAtTime(890, now + 0.14);
        osc.frequency.linearRampToValueAtTime(510, now + 0.32);

        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gain);
        gain.connect(this.analyser);
        osc.start(now);
        osc.stop(now + 0.36);
      }

      // Toggle Master BGM (Real track -> User audio -> Synth fallback)
      toggleMasterBgm() {
        this.initContext();
        if (this.isBgmPlaying) {
          this.stopBgm();
          return false;
        } else {
          this.startBgm();
          return true;
        }
      }

      startBgm() {
        this.isBgmPlaying = true;
        // 1. If user loaded their own audio
        if (this.customUserAudioBlobUrl) {
          this.bgmAudio.src = this.customUserAudioBlobUrl;
          this.bgmAudio.play().catch(() => this.activateSynthEngine());
          this.updateStatusBadge('用户自定义音频', 'text-amber-300', 'border-amber-500/40', 'bg-amber-500/20');
          return;
        }

        // 2. Play standard online song
        this.bgmAudio.src = this.onlineBgmUrl;
        const playPromise = this.bgmAudio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            this.usingSynthFallback = false;
            this.updateStatusBadge('原版只因你太美 · 播放中', 'text-emerald-300', 'border-emerald-500/40', 'bg-emerald-500/20');
          }).catch(err => {
            console.warn("Online playback error, falling back to Web Audio Synth", err);
            this.activateSynthEngine();
          });
        }
      }

      stopBgm() {
        this.isBgmPlaying = false;
        this.bgmAudio.pause();
        if (this.synthLoopTimer) clearTimeout(this.synthLoopTimer);
      }

      activateSynthEngine() {
        this.usingSynthFallback = true;
        this.synthStep = 0;
        this.updateStatusBadge('Web Audio 合成器模式', 'text-rose-300', 'border-rose-500/40', 'bg-rose-500/20');
        this.runSynthLoop();
      }

      runSynthLoop() {
        if (!this.isBgmPlaying || !this.usingSynthFallback) return;
        const noteObj = this.jntmScore[this.synthStep];
        if (noteObj.note > 0) {
          const f = this.midiToFreq(noteObj.note);
          this.playSynthNote(f, noteObj.dur, 'sawtooth', 0.16);
          this.playSynthNote(f / 2, noteObj.dur, 'triangle', 0.22); // Groovy bassline
        }

        // Dribble drum beat on beat steps
        if (this.synthStep % 2 === 0) {
          this.playDribbleThud(0.9);
        }

        this.synthStep = (this.synthStep + 1) % this.jntmScore.length;
        this.synthLoopTimer = setTimeout(() => {
          this.runSynthLoop();
        }, noteObj.dur * 1000);
      }

      updateStatusBadge(text, colorTxt, colorBrd, colorBg) {
        const badge = document.getElementById('audio-source-badge');
        const badgeText = document.getElementById('audio-source-name');
        badge.className = `text-[11px] px-2.5 py-1.5 rounded-xl flex items-center gap-1.5 font-medium border ${colorTxt} ${colorBrd} ${colorBg}`;
        badgeText.innerText = text;
      }

      // Play vocal sample (with Web Speech API + Audio element dual fallback)
      playSample(sampleId, backupText) {
        this.initContext();

        const audioEl = this.sampleAudioMap[sampleId];
        let playedOnline = false;

        if (audioEl) {
          audioEl.currentTime = 0;
          const p = audioEl.play();
          if (p !== undefined) {
            p.then(() => { playedOnline = true; }).catch(() => {
              // Online sample blocked/not found, run speech synthesis
              this.speakFallback(backupText);
            });
          }
        } else {
          this.speakFallback(backupText);
        }

        // Also trigger sound effect thud
        if (sampleId === 'ngm') {
          this.playSquawkSfx();
        } else {
          this.playDribbleThud(1.3);
        }
      }

      speakFallback(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN';
        u.pitch = 1.45; // Characteristic high pitch
        u.rate = 1.25;  // Fast comic delivery
        const voices = window.speechSynthesis.getVoices();
        const zh = voices.find(v => v.lang.includes('zh') || v.lang.includes('cmn'));
        if (zh) u.voice = zh;
        window.speechSynthesis.speak(u);
      }
    }

    const engine = new IkunAudioEngine();

    // DOM Elements
    const charPod = document.getElementById('char-pod');
    const charSvgBox = document.getElementById('character-svg-box');
    const ballInteractive = document.getElementById('ball-interactive');
    const stageQuote = document.getElementById('stage-quote');
    const comboStat = document.getElementById('combo-stat');
    const traineeTimer = document.getElementById('trainee-timer');
    const btnMasterBgm = document.getElementById('btn-master-bgm');
    const bgmPlayIcon = document.getElementById('bgm-play-icon');
    const bgmBtnText = document.getElementById('bgm-btn-text');
    const mainStage = document.getElementById('main-stage');
    const fxStageLights = document.getElementById('fx-stage-lights');
    const customAudioInput = document.getElementById('custom-audio-input');

    // Practice Time Incrementer
    let practiceSec = 0;
    setInterval(() => {
      practiceSec++;
      const m = String(Math.floor(practiceSec / 60)).padStart(2, '0');
      const s = String(practiceSec % 60).padStart(2, '0');
      traineeTimer.innerText = `2年半 ${m}:${s}`;
    }, 1000);

    const vizCanvas = document.getElementById('audio-visualizer-canvas');
    const vizCtx = vizCanvas.getContext('2d');
    function resizeCanvas() {
      vizCanvas.width = vizCanvas.parentElement.clientWidth;
      vizCanvas.height = vizCanvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function renderVisualizer() {
      requestAnimationFrame(renderVisualizer);
      vizCtx.clearRect(0, 0, vizCanvas.width, vizCanvas.height);

      if (!engine.analyser) {
        // Ambient rhythm line
        vizCtx.fillStyle = '#475569';
        for(let i = 0; i < 24; i++) {
          const barH = 5 + Math.sin(Date.now() * 0.005 + i * 0.4) * 4;
          const w = vizCanvas.width / 24;
          vizCtx.fillRect(i * w + 2, vizCanvas.height / 2 - barH / 2, w - 4, barH);
        }
        return;
      }

      const freqData = new Uint8Array(engine.analyser.frequencyBinCount);
      engine.analyser.getByteFrequencyData(freqData);

      const count = 36;
      const barWidth = vizCanvas.width / count;

      for (let i = 0; i < count; i++) {
        const val = freqData[i] || 0;
        const barHeight = (val / 255) * (vizCanvas.height - 4);
        const grad = vizCtx.createLinearGradient(0, vizCanvas.height, 0, 0);
        grad.addColorStop(0, '#f43f5e');
        grad.addColorStop(0.5, '#fb923c');
        grad.addColorStop(1, '#38bdf8');

        vizCtx.fillStyle = grad;
        vizCtx.fillRect(i * barWidth + 1, vizCanvas.height - barHeight, barWidth - 2, barHeight);
      }
    }
    renderVisualizer();

    let combo = 0;
    let comboResetTimeout = null;

    function showQuote(text) {
      stageQuote.innerText = text;
      stageQuote.style.opacity = '1';
      stageQuote.style.transform = 'translateY(0px)';
      clearTimeout(stageQuote.timer);
      stageQuote.timer = setTimeout(() => {
        stageQuote.style.opacity = '0';
        stageQuote.style.transform = 'translateY(-10px)';
      }, 2200);
    }

    function triggerDribbleAction(e) {
      combo++;
      comboStat.innerText = combo + 'x';
      comboStat.classList.add('scale-125', 'text-rose-400');
      setTimeout(() => comboStat.classList.remove('scale-125', 'text-rose-400'), 120);

      engine.playDribbleThud(1.0 + (combo % 12) * 0.05);

      // Bounce character slightly
      charPod.style.transform = `scale(1.08) rotate(${(Math.random() - 0.5) * 8}deg)`;
      setTimeout(() => charPod.style.transform = 'scale(1) rotate(0deg)', 100);

      // Spark particles
      spawnSparks(e);

      // Flash disco lights on high combos
      if (combo % 10 === 0) {
        fxStageLights.style.opacity = '1';
        setTimeout(() => fxStageLights.style.opacity = '0', 350);
        showQuote(`大招连击 x${combo}！厉不厉害你坤哥！`);
        spawnFlyingChicken();
      }

      clearTimeout(comboResetTimeout);
      comboResetTimeout = setTimeout(() => {
        combo = 0;
        comboStat.innerText = '0x';
      }, 2600);
    }

    function spawnSparks(e) {
      const x = (e && e.clientX) ? e.clientX : window.innerWidth / 2;
      const y = (e && e.clientY) ? e.clientY : window.innerHeight / 2;

      for (let i = 0; i < 7; i++) {
        const p = document.createElement('div');
        p.className = 'fixed pointer-events-none rounded-full z-50 transition-all duration-500';
        p.style.width = '8px';
        p.style.height = '8px';
        p.style.backgroundColor = ['#f43f5e', '#fbbf24', '#38bdf8', '#c084fc'][Math.floor(Math.random() * 4)];
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        document.body.appendChild(p);

        const destX = (Math.random() - 0.5) * 160;
        const destY = (Math.random() - 0.5) * 160;

        requestAnimationFrame(() => {
          p.style.transform = `translate(${destX}px, ${destY}px) scale(0)`;
          p.style.opacity = '0';
        });

        setTimeout(() => p.remove(), 500);
      }
    }

    // Flying Roast Chickens Effect (暴走特效)
    function spawnFlyingChicken() {
      const container = document.getElementById('roast-chickens-box');
      const item = document.createElement('div');
      item.className = 'absolute text-4xl';
      item.innerText = ['🍗', '🐔', '🏀', '🌰', '✨'][Math.floor(Math.random() * 5)];
      item.style.left = Math.random() * 90 + 'vw';
      item.style.bottom = '-50px';
      item.style.animation = 'chickenFloat 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards';
      container.appendChild(item);
      setTimeout(() => item.remove(), 2300);
    }

    // Dynamic Danmaku System
    const danmakuBox = document.getElementById('danmaku-box');
    const memeDanmakuPool = [
      '只因你太美 baby~',
      '你干嘛~~ 哎呦~~',
      '香精煎鱼食不食！',
      '练习时长两年半的个人练习生',
      '露出鸡脚了吧小黑子',
      '巅峰产生虚伪的拥护，黄昏见证真正的信徒',
      '厉不厉害你坤哥！',
      '再黑我就抱紧啦！',
      '蒸乌鱼，荔枝呢？',
      '油饼食不食，苏珊！',
      '这球技，NBA连夜招揽',
      '中分头，背带裤，我是坤坤你记住'
    ];

    function sendDanmaku(text, customStyle = '') {
      const el = document.createElement('div');
      el.className = `danmaku-item text-base sm:text-2xl drop-shadow-md ${customStyle}`;
      el.innerText = text;

      const colors = ['text-rose-400', 'text-amber-300', 'text-sky-300', 'text-emerald-400', 'text-purple-400'];
      if (!customStyle) el.classList.add(colors[Math.floor(Math.random() * colors.length)]);

      el.style.top = Math.floor(Math.random() * 60 + 10) + '%';
      const duration = (Math.random() * 3 + 5.5).toFixed(1);
      el.style.animationDuration = duration + 's';

      danmakuBox.appendChild(el);
      setTimeout(() => el.remove(), duration * 1000);
    }

    // Auto stream danmaku
    setInterval(() => {
      if (document.hidden) return;
      const q = memeDanmakuPool[Math.floor(Math.random() * memeDanmakuPool.length)];
      sendDanmaku(q);
    }, 2200);

    // Character Poses Switching
    const poseBtns = document.querySelectorAll('.pose-btn');
    function setPose(poseClass, btnEl) {
      charSvgBox.classList.remove('pose-shrug', 'pose-iron', 'pose-dribble');
      charSvgBox.classList.add(poseClass);
      poseBtns.forEach(b => {
        b.classList.remove('bg-rose-600', 'text-white');
        b.classList.add('bg-slate-800', 'text-slate-300');
      });
      if (btnEl) {
        btnEl.classList.add('bg-rose-600', 'text-white');
        btnEl.classList.remove('bg-slate-800', 'text-slate-300');
      }
    }

    document.getElementById('btn-pose-shrug').addEventListener('click', (e) => {
      setPose('pose-shrug', e.currentTarget);
      showQuote('经典耸肩：只因你太美！');
      engine.playDribbleThud(1.1);
    });

    document.getElementById('btn-pose-iron').addEventListener('click', (e) => {
      setPose('pose-iron', e.currentTarget);
      showQuote('铁山靠暴走！撞碎黑子！');
      mainStage.classList.add('anim-shake');
      setTimeout(() => mainStage.classList.remove('anim-shake'), 600);
      engine.playDribbleThud(1.5);
    });

    document.getElementById('btn-pose-dribble').addEventListener('click', (e) => {
      setPose('pose-dribble', e.currentTarget);
      showQuote('胯下疯狂打桩运球！');
      engine.playDribbleThud(1.3);
    });

    // Costume: Sunglasses & Roasted Chicken Mask
    let costumeStep = 0;
    const glassesG = document.getElementById('costume-glasses');
    const combG = document.getElementById('costume-chicken-comb');
    const faceSkin = document.getElementById('face-skin');

    document.getElementById('btn-toggle-glasses').addEventListener('click', () => {
      costumeStep = (costumeStep + 1) % 3;
      engine.playSquawkSfx();
      if (costumeStep === 0) {
        glassesG.classList.add('hidden');
        combG.classList.add('hidden');
        faceSkin.setAttribute('fill', '#fde047');
        showQuote('换装：经典练习生原版');
      } else if (costumeStep === 1) {
        glassesG.classList.remove('hidden');
        combG.classList.add('hidden');
        faceSkin.setAttribute('fill', '#fde047');
        showQuote('换装：冷酷墨镜潮男！');
      } else {
        glassesG.classList.remove('hidden');
        combG.classList.remove('hidden');
        faceSkin.setAttribute('fill', '#fb923c');
        showQuote('换装：香精煎鱼战斗鸡！🐔');
      }
    });

    // Meme Sticker: Chicken Foot
    document.getElementById('btn-meme-sticker').addEventListener('click', () => {
      sendDanmaku('🐾 警惕小黑子露出鸡脚！', 'text-amber-300 font-black text-2xl');
      showQuote('露出鸡脚了吧小黑子！');
      engine.playSample('chicken_foot', '露出鸡脚了吧小黑子');
      for(let i=0; i<4; i++) setTimeout(spawnFlyingChicken, i * 150);
    });

    // Lychee feeder
    document.getElementById('btn-throw-lychee').addEventListener('click', () => {
      sendDanmaku('🌰 投喂新鲜荔枝！理智，怎么理智！', 'text-pink-400 font-black text-xl');
      showQuote('你叫我怎么荔枝！');
      engine.playSquawkSfx();
    });

    // Click on Basketball & Character
    ballInteractive.addEventListener('pointerdown', (e) => {
      triggerDribbleAction(e);
      e.stopPropagation();
    });

    charPod.addEventListener('click', (e) => {
      engine.playSample('ngm', '你干嘛~~ 哎呦~~！');
      showQuote('你干嘛～～哎呦～～！');
      triggerDribbleAction(e);
    });

    // BGM Button Toggle
    btnMasterBgm.addEventListener('click', () => {
      const active = engine.toggleMasterBgm();
      if (active) {
        bgmPlayIcon.className = 'ph-bold ph-stop-circle text-lg';
        bgmBtnText.innerText = '暂停只因BGM';
        btnMasterBgm.classList.add('ring-2', 'ring-rose-400');
        showQuote('只因你太美！Music 响起！');
        sendDanmaku('🎵 全体起立！只因你太美！', 'text-rose-400 font-extrabold text-2xl');
      } else {
        bgmPlayIcon.className = 'ph-bold ph-play-circle text-lg';
        bgmBtnText.innerText = '只因你太美 BGM';
        btnMasterBgm.classList.remove('ring-2', 'ring-rose-400');
      }
    });

    // IKUN Launchpad Pads Binding
    document.querySelectorAll('.ikun-pad').forEach(pad => {
      pad.addEventListener('click', () => {
        const id = pad.getAttribute('data-id');
        const text = pad.getAttribute('data-text');

        // Play Sample
        engine.playSample(id, text);
        showQuote(text);
        sendDanmaku(text);

        // Flash pad
        pad.classList.add('border-rose-400', 'scale-95');
        setTimeout(() => pad.classList.remove('border-rose-400', 'scale-95'), 140);
        spawnFlyingChicken();
      });
    });

    // Spacebar Iron Lean Berserk Mode
    let spaceDown = false;
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !spaceDown && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        spaceDown = true;
        setPose('pose-iron', document.getElementById('btn-pose-iron'));
        mainStage.classList.add('anim-shake');
        fxStageLights.style.opacity = '1';
        engine.playSample('sing_jump_rap', '唱跳rap篮球');
        showQuote('铁山靠暴走狂暴模式！');
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
        spaceDown = false;
        setPose('pose-shrug', document.getElementById('btn-pose-shrug'));
        mainStage.classList.remove('anim-shake');
        fxStageLights.style.opacity = '0';
      }
    });

    // Custom Audio File Import (IKUN DIY)
    customAudioInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        if (engine.customUserAudioBlobUrl) {
          URL.revokeObjectURL(engine.customUserAudioBlobUrl);
        }
        engine.customUserAudioBlobUrl = URL.createObjectURL(file);
        showQuote(`已加载本地音频: ${file.name.slice(0, 10)}...`);
        sendDanmaku(`已成功装载专属IKUN神曲！`, 'text-sky-300 font-bold text-xl');
        engine.stopBgm();
        engine.startBgm();
        bgmPlayIcon.className = 'ph-bold ph-stop-circle text-lg';
        bgmBtnText.innerText = '暂停专属BGM';
      }
    });

    // Custom Danmaku Form
    document.getElementById('danmaku-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('danmaku-input');
      const val = input.value.trim();
      if (val) {
        sendDanmaku(val, 'text-amber-300 text-2xl font-black');
        showQuote(val);
        input.value = '';
      }
    });
  </script>
</body>
</html>
